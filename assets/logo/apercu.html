<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logos SZ — propositions</title>
<style>body{margin:0;background:#0a0a0b;color:#f3f1ec;font:16px/1.5 system-ui,sans-serif;padding:24px}h1{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{border:1px solid #2a2a2e;border-radius:18px;overflow:hidden}.card h2{font-size:16px;margin:0;padding:14px 16px;border-top:1px solid #2a2a2e}
.row{display:flex;align-items:center;justify-content:center;gap:18px;padding:26px;min-height:170px}.light{background:#fff}
.row img{max-width:100%;height:110px}.small{display:flex;gap:12px;align-items:center;padding:0 16px 16px;color:#a2a2a8;font-size:13px}.small img{height:32px}</style></head>
<body><h1>Logo SZ — 3 propositions</h1><div class="grid">
<div class="card"><div class="row"><img src="sz-haltere.svg" alt=""></div><div class="row light"><img src="sz-haltere-clair.svg" alt=""></div><h2>1 · Haltère</h2></div>
<div class="card"><div class="row"><img src="sz-kettlebell.svg" alt=""></div><div class="row light"><img src="sz-kettlebell-clair.svg" alt=""></div><h2>2 · Kettlebell</h2></div>
<div class="card"><div class="row"><img src="sz-badge.svg" alt=""></div><div class="row light"><img src="sz-badge.svg" alt=""></div><h2>3 · Badge sprint</h2><div class="small">Favicon : <img src="sz-badge.svg" alt=""><img src="sz-badge.svg" alt="" style="height:16px"></div></div>
</div></body></html>
